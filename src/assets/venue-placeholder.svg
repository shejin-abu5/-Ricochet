<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!--
    Shared artwork: a pitch seen from above.

    Used at two very different sizes:
      40px  the thumbnail on each row of VenuesNearby
      200px a faded watermark in the corner of the match detail hero

    THE BACKGROUND IS DELIBERATELY TRANSPARENT. It used to be an opaque
    #1e1e1e rect, which was fine while this was only ever a 40px thumbnail.
    As a large low-opacity watermark that rect renders as a hard-edged grey
    square floating on the card, which reads as a bug rather than a texture.

    So the fill moved OUT of the artwork and into the caller: VenuesNearby
    puts bg-raised on its <img>, and the watermark simply doesn't want one.
    Same file, both uses, no second copy to keep in step.

    Colours below are still hard-coded rather than read from the tokens in
    index.css, because an <img> loads in its own document and cannot see the
    host page's CSS custom properties. #d2ff00 is a copy of color-primary; if
    the brand colour changes, this file has to be edited by hand.

    Careful editing these comments: an XML comment may not contain a double
    hyphen, so token names like "color primary" are written without their
    leading dashes. A stray "- -" in here makes the whole file fail to parse
    and the browser renders a broken-image icon.
  -->

  <!-- Mown stripes: barely-there bands so the ground reads as grass rather
       than as a flat swatch. 4% opacity is deliberate. At 40px on screen this
       should be texture you feel, not stripes you count. -->
  <g fill="#d2ff00" opacity="0.04">
    <rect y="8" width="48" height="8"/>
    <rect y="24" width="48" height="8"/>
    <rect y="40" width="48" height="8"/>
  </g>

  <!-- Pitch markings, one stroke weight throughout so nothing reads as more
       important than anything else. It is a picture, not a diagram. -->
  <g fill="none" stroke="#d2ff00" stroke-opacity="0.38" stroke-width="1.25">
    <rect x="6.5" y="10.5" width="35" height="27"/>
    <line x1="24" y1="10.5" x2="24" y2="37.5"/>
    <circle cx="24" cy="24" r="5"/>
    <path d="M6.5 17.5h5v13h-5"/>
    <path d="M41.5 17.5h-5v13h5"/>
  </g>
</svg>
